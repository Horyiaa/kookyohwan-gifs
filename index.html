<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Koo Kyo-hwan GIFs</title>
<style>
  :root { box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    --ink:#2b2d42; --muted:#8a8fa8; --line:#d9dcec; --glass:rgba(255,255,255,.55); --accent:#7b84e8; }
  html { scroll-padding-top:env(safe-area-inset-top,0px); }
  body { margin:0; padding:28px 16px 40px; min-height:100vh; color:var(--ink); text-align:center;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; position:relative; overflow-x:hidden;
    background:linear-gradient(135deg,#c3d2fa 0%,#eaf2ff 35%,#f3eef8 65%,#e6d6e8 100%) fixed; }
  .frame { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:44px 28px 36px;
    background:var(--glass); border:3px solid #fff; border-radius:28px;
    box-shadow:0 20px 60px rgba(110,120,180,.18); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .label { font-size:11px; letter-spacing:.4em; color:var(--muted); margin:0 0 10px; text-transform:uppercase; }
  h1 { font-weight:300; font-size:clamp(30px,6vw,52px); letter-spacing:.12em; margin:0 0 18px; }
  .rule { width:36px; height:1px; background:var(--ink); margin:0 auto 20px; opacity:.6; }
  .sources { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:0 0 26px; }
  .sources span { font-size:13px; font-style:italic; letter-spacing:.05em; color:var(--ink); border:1px solid var(--line);
    background:rgba(255,255,255,.6); border-radius:999px; padding:6px 16px; }
  .credit { background:rgba(255,255,255,.7); border:1px solid #fff; border-radius:16px; padding:16px 18px; max-width:560px; margin:0 auto 18px;
    box-shadow:0 8px 24px rgba(110,120,180,.12); font-size:14px; letter-spacing:.04em; }
  .credit p { margin:6px 0; }
  .credit strong { color:var(--accent); font-weight:600; }
  .tip { color:var(--muted); font-size:13px; letter-spacing:.03em; margin:0 0 30px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:15px; text-align:left; }
  .card { background:rgba(255,255,255,.75); border:1px solid #fff; border-radius:14px; padding:8px;
    box-shadow:0 6px 18px rgba(110,120,180,.12); transition:transform .2s, box-shadow .2s; }
  .card:hover { transform:translateY(-3px); box-shadow:0 14px 30px rgba(110,120,180,.22); }
  .card img { width:100%; border-radius:8px; display:block; min-height:100px; cursor:zoom-in; background:#eef0fa; }
  .btns { display:flex; gap:6px; margin-top:8px; }
  .btns button { flex:1; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 4px; font-size:12px; letter-spacing:.06em; cursor:pointer; transition:background .15s; }
  .btns button:hover { background:#f1f3fd; }
  .btns button.ok { background:var(--accent); border-color:var(--accent); color:#fff; }
  .lightbox { position:fixed; inset:0; background:rgba(40,44,80,.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; padding-top:calc(20px + env(safe-area-inset-top,0px)); cursor:zoom-out; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .lightbox .close { position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); right:16px; font-size:32px; line-height:1; color:#fff; }
  @media (max-width:600px) { .frame { padding:30px 14px 24px; border-radius:22px; } }
</style>
</head>
<body>
    <div class="frame">

  </div>

<script>

  const BATCH = 24;
  let shown = 0;
  const grid = document.getElementById("grid");
  const sentinel = document.createElement("div");
  grid.after(sentinel);

  function copy(text, btn) {
    const done = () => {
      const old = btn.textContent;
      btn.textContent = "Copié ✓";
      btn.classList.add("ok");
      setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1500);
    };
    const fallback = () => {
      const t = document.createElement("textarea");
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      t.remove();
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }

  function addCard(id, i) {
    const url = "https://yourimageshare.com/ib/" + id + ".gif";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<img loading="lazy" src="' + url + '" alt="Koo Kyo-hwan GIF ' + (i + 1) + '">' +
      '<div class="btns"><button data-t="url">Lien</button><button data-t="bbcode">BBCode</button><button data-t="html">HTML</button></div>';
    card.querySelectorAll("button").forEach(b => {
      b.addEventListener("click", () => {
        const t = b.dataset.t;
        const txt = t === "url" ? url : t === "bbcode" ? "[img]" + url + "[/img]" : '<img src="' + url + '">';
        copy(txt, b);
      });
    });
    card.querySelector("img").addEventListener("click", () => openBox(url, i + 1));
    grid.appendChild(card);
  }

  function showMore() {
    const end = Math.min(shown + BATCH, ids.length);
    for (; shown < end; shown++) addCard(ids[shown], shown);
    if (shown >= ids.length && observer) observer.disconnect();
  }

  let observer = null;
  if ("IntersectionObserver" in window) {
    observer = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) showMore();
    }, { rootMargin: "800px 0px" });
    showMore();
    observer.observe(sentinel);
  } else {
    while (shown < ids.length) showMore();
  }

  const box = document.getElementById("lightbox");
  const boxImg = document.getElementById("lightbox-img");
  function openBox(url, n) { boxImg.src = url; boxImg.alt = "Koo Kyo-hwan GIF " + n; box.classList.add("open"); }
  function closeBox() { box.classList.remove("open"); boxImg.src = ""; }
  box.addEventListener("click", e => { if (e.target !== boxImg) closeBox(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeBox(); });
</script>
